name: Keep Supabase Alive

# 防止 Supabase 免费项目因连续 7 天无 API 请求被自动暂停。
# 每天 UTC 0:00（北京时间 8:00）ping 一次，即使 GitHub 偶发延迟或跳过一两天，
# 也远在 7 天安全线内，项目永远不会被暂停。完全免费、零成本。

on:
  schedule:
    # 每天 UTC 0:00 运行（= 北京时间 8:00）
    - cron: '0 0 * * *'
  # 允许手动触发：首次配置完 Secrets 后可立即测试一次
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase at $(date -u)"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 SUPABASE_URL 或 SUPABASE_ANON_KEY secret，请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/countdowns?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            --max-time 30)
          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body (first 200 chars): $(head -c 200 /tmp/resp.txt)"
          # 只要收到 Supabase 的响应（包括 RLS 返回空数组的 200，或 401/406），
          # 都说明项目处于活动状态，不会被暂停。
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "✓ Supabase kept active (status ${HTTP_CODE})"
          else
            echo "::warning::Supabase 返回 $HTTP_CODE，请检查 URL / anon key 是否正确，以及项目是否已恢复"
            exit 1
          fi
